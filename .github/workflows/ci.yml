name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand (e.g. on a fork, where push/PR runs start disabled)

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pip install -e ".[ocr]" || echo "::warning::OCR extra not installable on this Python; OCR tests skip"
      - run: ruff check .
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build (8 MB flash, e.g. XIAO ESP32S3, and 4 MB, e.g. ESP32-S3-Zero)
        working-directory: hardware
        run: |
          cp hid_bridge/secrets.example.h hid_bridge/secrets.h
          for size in 8M 4M; do
            arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=$size" hid_bridge
          done
