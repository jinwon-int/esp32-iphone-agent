name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand (e.g. on a fork, where push/PR runs start disabled)

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # OpenCV (pulled in by rapidocr) needs libGL even headless; without it the extra installs but cannot import
      - run: sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -e ".[ocr]" || echo "::warning::OCR extra not installable on this Python; OCR tests skip"
      - run: python -c "from hidagent.ocr import import_problem; print('OCR import:', import_problem() or 'ok')"
      - run: ruff check .
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build (8 MB flash, e.g. XIAO ESP32S3, and 4 MB, e.g. ESP32-S3-Zero; relative mouse and absolute pointer)
        working-directory: hardware
        run: |
          cp hid_bridge/secrets.example.h hid_bridge/secrets.h
          for size in 8M 4M; do
            for abs in 0 1; do
              arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=$size" \
                --build-property "compiler.cpp.extra_flags=-DABSOLUTE_POINTER=$abs" hid_bridge
            done
          done
      - name: Build the Bluetooth LE link (BLE_LINK=1, both pointers; secrets.h with DEVICE_KEY only, no Wi-Fi)
        working-directory: hardware
        run: |
          echo '#define DEVICE_KEY "ci-only-not-a-real-device-key"' > hid_bridge/secrets.h
          for abs in 0 1; do
            arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=4M" \
              --build-property "compiler.cpp.extra_flags=-DABSOLUTE_POINTER=$abs -DBLE_LINK=1" hid_bridge
          done
      - name: Build Bluetooth LE HID (BLE_LINK=1 BLE_HID=1, both pointers, #104), and check BLE_HID alone is refused
        working-directory: hardware
        run: |
          echo '#define DEVICE_KEY "ci-only-not-a-real-device-key"' > hid_bridge/secrets.h
          for abs in 0 1; do
            arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=4M" \
              --build-property "compiler.cpp.extra_flags=-DABSOLUTE_POINTER=$abs -DBLE_LINK=1 -DBLE_HID=1" hid_bridge
          done
          if arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=4M" \
              --build-property "compiler.cpp.extra_flags=-DBLE_HID=1" hid_bridge > blehid-alone.log 2>&1; then
            echo "BLE_HID=1 without BLE_LINK=1 should not build"; exit 1
          fi
          grep -q "BLE_HID=1 needs BLE_LINK=1" blehid-alone.log
      - name: Build with the away-from-home options (second Wi-Fi + WireGuard tunnel, #6; dummy keys)
        working-directory: hardware
        run: |
          cp hid_bridge/secrets.example.h hid_bridge/secrets.h
          key() { head -c 32 /dev/urandom | base64; }
          cat >> hid_bridge/secrets.h <<EOF
          #define WIFI_SSID2 "hotspot"
          #define WIFI_PASS2 "hotspot-password"
          #define WG_PRIVATE_KEY "$(key)"
          #define WG_PEER_PUBLIC_KEY "$(key)"
          #define WG_ENDPOINT "203.0.113.5"
          #define WG_ADDRESS "10.9.0.2"
          #define SERVER_HOST_HOME "192.168.1.10"
          EOF
          arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=4M" \
            --build-property "compiler.cpp.extra_flags=-DABSOLUTE_POINTER=1" hid_bridge
      - name: flash.sh — shellcheck, then dry runs against a built image (no board; #106)
        working-directory: hardware
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck flash.sh
          echo '#define DEVICE_KEY "ci-only-not-a-real-device-key"' > hid_bridge/secrets.h
          FLASH_SIZE=8M ABSOLUTE_POINTER=1 BLE_LINK=1 BLE_HID=1 ./flash.sh --dry-run
          arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=8M" \
            --build-property "compiler.cpp.extra_flags=-DABSOLUTE_POINTER=1 -DBLE_LINK=1 -DBLE_HID=1" --output-dir build hid_bridge
          FLASH_SIZE=8M ./flash.sh --dry-run --wait=5 --expect-flash 8M --image build/hid_bridge.ino.merged.bin | tee plan.log
          grep -q -- '-> 0x0 ' plan.log && grep -q 'expect flash: 8M' plan.log
          ./flash.sh --dry-run --image build/hid_bridge.ino.bin | grep -q -- '-> 0x10000 '
          ! ./flash.sh --dry-run --image build/hid_bridge.ino.bin --expect-flash 7M      # bad size is refused
          ! ./flash.sh --dry-run --expect-flash 8M                                       # needs --image
          ! ./flash.sh --dry-run --image build/does-not-exist.bin                        # missing image
